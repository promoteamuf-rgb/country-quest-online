<!doctype html>
<html lang="en">
<head>

<body class="catch-page" data-phase="intro">

  <div class="wake"></div>
 </div>
 <div class="water">
   <div class="water-glow"></div><div class="surface"></div><div class="sun-rays"></div><div class="coral coral-left"></div><div class="coral coral-right"></div>
   <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><span class="bubble b4"></span><span class="bubble b5"></span>
   <span class="deep-fish ambient-fish one">🐠</span><span class="deep-fish ambient-fish two">🐟</span><span class="deep-fish ambient-fish three">🐡</span><span class="deep-fish ambient-fish four">🦈</span>
 </div>
 <div class="fishing-line" id="fishingLine"><span class="line-wire"></span><span class="hook" id="hook">🪝</span></div>
 <div class="caught-fish" id="caughtFish"><div class="fish-body" id="fishBody">🐟</div><span class="fish-aura"></span></div>
 <div class="splash-ring" id="splashRing"></div>
</div>
<div class="site-ui">
 <header class="catch-header">
   <a class="brand" href="/" aria-label="Country Quest home"><span class="brand-icon">✳</span><span>COUNTRY<b>QUEST</b></span></a>
   <nav><a href="/" id="allGames">All games</a><a href="/solo.html" id="soloLink">Solo games</a></nav>
   <div class="languages" role="group" aria-label="Language / Språk">
     <button type="button" data-lang="sv" aria-pressed="false">🇸🇪 SV</button>
     <button type="button" data-lang="en" aria-pressed="true">🇬🇧 EN</button>
   </div>
 </header>
 <main class="catch-layout">
  <section class="quiz-panel" id="stage" aria-live="polite"></section>
  <aside class="catch-hud" aria-label="Fishing score">
    <div class="hud-title" id="hudTitle">FISHING LOG</div>
    <div class="hud-stat"><span id="hudCatchLabel">FISH CAUGHT</span><strong id="fishCount">0 / 7</strong></div>
    <div class="hud-stat"><span id="hudWeightLabel">TOTAL WEIGHT</span><strong id="totalWeight">0 kg</strong></div>
    <div class="hud-stat"><span id="hudBestLabel">BIGGEST FISH</span><strong id="bestFish">—</strong></div>
    <div class="rarity-track" id="rarityTrack"><span>COMMON</span><span>UNCOMMON</span><span>RARE</span><span>EPIC</span><span>LEGENDARY</span></div>
  </aside>
 </main>
 <footer class="catch-footer"><span id="footnote">Original game · Curated rarity ratings, not live player statistics</span><a href="/" id="homeFooter">Country Quest ↗</a></footer>
</div>
