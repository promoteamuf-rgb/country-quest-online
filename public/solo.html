:root{--bg:#080f1d;--surface:#142238;--surface2:#1d314b;--border:#2b435c;--text:#f4faff;--muted:#9eafc3;--mint:#81edd1;--yellow:#f4ce77;--red:#ff9da5;--blue:#8dbfff}
body{background:radial-gradient(ellipse 650px 520px at 95% 1%,#1a3550 0%,transparent 75%),radial-gradient(ellipse 750px 550px at 0% 35%,#10243a 0%,transparent 72%),#080f1d}

.logo{font-size:22px;letter-spacing:-.8px}.logo .globe{display:grid;place-items:center;width:42px;height:42px;background:#183951;border:1px solid #336579;border-radius:13px;font-size:25px}

.nav-multiplayer:hover{background:#23415b}
.hero{padding:32px 0 8px;position:relative}
.hero:before{content:"";pointer-events:none;position:absolute;right:2%;top:-15px;width:250px;height:250px;border:1px solid #75d4d82d;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 40px,#55e4cf14 41px 42px),radial-gradient(circle at 35% 35%,#82e8d51e,transparent 58%);opacity:.7}
.hero h1{font-size:clamp(46px,6.5vw,76px);font-weight:900;max-width:730px;letter-spacing:-3px;margin:14px 0 17px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#86f0d1,#89c8ff);color:transparent;background-clip:text}
.hero p{font-size:17px;color:#aabbd0}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:2.3px;color:#91f0d4}
.modes{gap:18px}
.mode{overflow:hidden;border-radius:24px;padding:27px 29px;min-height:194px;background:linear-gradient(145deg,#182941,#122033);box-shadow:0 12px 36px #0002;border:1px solid #39516b;transition:.2s ease}
.mode:hover{transform:translateY(-5px);border-color:#7debd0;box-shadow:0 18px 42px #0007}
.mode:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-65px;bottom:-85px;pointer-events:none;background:#62dfc51a}

.mode .emoji{width:48px;height:48px;display:grid;place-items:center;background:#2c4359;border:1px solid #45627a;border-radius:14px;font-size:28px;margin-bottom:17px}
.mode strong{font-size:24px;letter-spacing:-.7px}.mode span:not(.go){font-size:14px}
.mode .go{top:25px;right:28px;font-size:21px}
.summary{border-top:1px solid #32465b77;margin-top:30px;padding-top:21px}
.panel{background:linear-gradient(140deg,#172941,#101d31);border:1px solid #35516b;border-radius:24px;box-shadow:0 16px 55px #0004;padding:32px}
.gamehead{margin-top:34px}
.chip{background:#203450;border-color:#34516b;color:#b1c7d7}
.clue{background:radial-gradient(circle at 100% 0%,#2c5a63 0%,transparent 65%),#21344b;border-color:#476178;border-radius:18px}
.clue .words{font-size:clamp(22px,3vw,28px)}
.field{background:#0c182a;border-color:#446179}
.btn{background:linear-gradient(110deg,#90f4d4,#65cddd);box-shadow:0 4px 20px #63dfcf1a}

.btn:hover:not(:disabled){filter:brightness(1.09)}
.choice{background:#1e324c;border-color:#3c5b75;border-radius:15px}
.choice:hover:not(:disabled){background:#294663}
.shapeholder{position:relative;min-height:330px;margin:22px 0;border-radius:22px;overflow:hidden;border:1px solid #466275;background:radial-gradient(ellipse 310px 230px at 52% 48%,#203d50,#101f35 75%)}
.shapeholder:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#7abfbd12 1px,transparent 1px),linear-gradient(90deg,#7abfbd12 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.shapeholder:after{content:"";position:absolute;inset:15px;border:1px solid #7db3bd24;border-radius:15px;pointer-events:none}
.shapeholder svg{position:relative;z-index:1;max-width:540px;height:275px;overflow:visible;filter:drop-shadow(0 12px 23px #0008)}
.shapeholder path{stroke:#d8fff4;stroke-opacity:.32;stroke-width:.6;fill:url(#outlineFill);stroke-linejoin:round}
.footer{color:#70879e;border-top:1px solid #34495b77;padding-top:20px;margin-top:64px}

      {name:'Japan',flag:'🇯🇵',aliases:[],clues:['This country has thousands of islands.','Its traditional art includes origami and ukiyo-e.','Its high-speed rail network is called the Shinkansen.','Mount Fuji is one of its best-known landmarks.','Its capital is Tokyo.']},

function scoreboard(){return `<div class="competitive">${[0,1].map(i=>`<div class="player ${vs.index===i?'active':''}"><small>Player ${i+1}</small><b>${vs.scores[i]} pts</b></div>`).join('')}</div>`}
function renderGame(){document.body.dataset.game=game.type;let isVs=mode==='versus';let extra=isVs?scoreboard():`<div class="scoreline"><span class="chip">Score: <b>${points}</b></span><span class="chip">Progress: <b>${round}</b> rounds finished</span></div>`;let inner='';
if(game.type==='clues'){let value=[100,80,60,40,20][clueIndex];inner=`<div class="dots">${[0,1,2,3,4].map(i=>`<span class="dot ${i<=clueIndex?'on':''}"></span>`).join('')}</div><div class="clue"><div class="step">CLUE ${clueIndex+1} OF 5 · ${value} POINTS</div><div class="words">${esc(game.data.clues[clueIndex])}</div></div><form id="guessForm"><div class="formline"><input id="guessInput" class="field" list="countryList" placeholder="Type a country..." autocomplete="off" aria-label="Country guess" required><datalist id="countryList">${countries.map(x=>`<option value="${esc(x.name)}"></option>`).join('')}${shapeNames.filter(x=>!countries.some(y=>y.name===x)).map(x=>`<option value="${esc(x)}"></option>`).join('')}${Object.values(window.CQI18N?.countryNames||{}).map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist><button class="btn" type="submit">Guess</button></div></form><div class="actions"><button class="btn alt" id="nextClue" ${clueIndex>=4?'disabled':''}>Next clue →</button><button class="btn outline" id="skip">Skip country</button></div><div class="notice ${feedback?'bad':''}" role="status">${esc(feedback)}</div>`}
if(game.type==='outline')inner=`<p class="prompt">Which country is this?</p><div class="shapeholder"><svg viewBox="${game.data.viewBox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Accurate silhouette of a country"><defs><linearGradient id="outlineFill" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9ef8d9"/><stop offset="100%" stop-color="#37b9d0"/></linearGradient></defs><path d="${game.data.path}" fill="url(#outlineFill)" fill-rule="evenodd"></path></svg></div><div class="options">${game.options.map(o=>`<button class="choice" data-answer="${esc(o)}">${esc(o==='United States of America'?'United States':o)}</button>`).join('')}</div><div class="notice ${feedback?'bad':''}" role="status">${esc(feedback)}</div>`;
if(game.type==='year')inner=`<p class="prompt">In what year did this happen?</p><div class="clue"><div class="words">${esc(game.data)}</div></div><div class="options">${game.options.map(y=>`<button class="choice" data-answer="${y}">${y}</button>`).join('')}</div><div class="notice ${feedback?'bad':''}" role="status">${esc(feedback)}</div>`;
$('#app').innerHTML=gameHead()+`<div class="panel">${extra}${inner}</div>`;wireLeave();if(game.type==='clues'){$('#guessForm').addEventListener('submit',e=>{e.preventDefault();guess($('#guessInput').value)});$('#nextClue').onclick=()=>{if(clueIndex<4){clueIndex++;feedback='';renderGame()}};$('#skip').onclick=()=>resolve(false,true);$('#guessInput').focus()}else{document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>guess(el.dataset.answer))}}
function guess(value){if(locked)return;const canonical=window.CQI18N?.canonicalCountry(value)||value;let good=normalize(canonical)===normalize(game.answer)||(game.type==='clues'&&game.data.aliases.some(a=>normalize(value)===normalize(a)))||(game.answer==='United States of America'&&['unitedstates','usa'].includes(normalize(canonical)));if(!good&&game.type==='clues'){feedback='Not quite. Try again or reveal the next clue.';$('#guessInput').value='';$('#guessInput').focus();$('#app .notice').textContent=feedback;return}picked=String(value);resolve(good,false)}
function resolve(good,skipped){if(locked)return;locked=true;let amount=good?(game.type==='clues'?[100,80,60,40,20][clueIndex]:100):0;points+=amount;if(vs)vs.scores[vs.index]+=amount;if(good){saved.wins++;saved.streak++}else saved.streak=0;saved.best=Math.max(saved.best,points,vs?Math.max(...vs.scores):0);persist();if(game.type!=='clues'){document.querySelectorAll('[data-answer]').forEach(el=>{el.disabled=true;if(normalize(el.dataset.answer)===normalize(game.answer))el.classList.add('correct');else if(el.dataset.answer===picked)el.classList.add('wrong')})}else{$('#guessInput').disabled=true;$('#guessForm button').disabled=true;$('#nextClue').disabled=true;$('#skip').disabled=true}let content=good?`✅ Correct! +${amount} points`:`${skipped?'Skipped.':'Not this time.'} Answer: ${game.answer}`;let notice=$('#app .notice');notice.textContent=content;notice.className='notice '+(good?'good':'bad');let action=document.createElement('div');action.className='actions';action.innerHTML=`<button id="continue" class="btn">${(mode==='versus'?vs.turn===5:round===4)?'See results →':'Next round →'}</button>`;notice.after(action);$('#continue').onclick=()=>{if(vs)vs.turn++;else round++;nextRound()}}
function finish(){saved.played++;saved.best=Math.max(saved.best,points,vs?Math.max(...vs.scores):0);persist();let result=vs?(vs.scores[0]===vs.scores[1]?'It’s a tie!':`Player ${vs.scores[0]>vs.scores[1]?1:2} wins!`):'Game complete!';let score=vs?scoreboard():`<div class="bigscore">${points} pts</div>`;$('#app').innerHTML=`<div class="gamehead"><button id="leave" class="back">← Modes</button><span class="tag">RESULTS</span></div><div class="panel center"><div class="finish">🏆</div><h2>${result}</h2><p class="quiet">${vs?'6 rounds played':'5 rounds played'}</p>${score}<div class="actions" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn alt" id="modes">All modes</button></div></div>`;wireLeave();$('#again').onclick=()=>start(mode);$('#modes').onclick=home}
function wireLeave(){$('#leave').onclick=home}
window.CQI18N?.loadSolo(countries,yearQuestions);$('#homeBtn').onclick=home;updateHeader();const firstMode=new URLSearchParams(location.search).get('mode');if(['clues','outline','year'].includes(firstMode))start(firstMode);else home();
</script></body></html>
