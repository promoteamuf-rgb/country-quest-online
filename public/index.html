<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Country Quest — Explore the World</title><style>
:root{color-scheme:dark;--bg:#0b1120;--box:#192339;--line:#33435a;--main:#7be6c9;--text:#f4f7ff;--sub:#a2afc2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Arial,sans-serif}main{max-width:790px;margin:auto;padding:28px 18px 90px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 17px}header b{font-size:23px}header span,.muted{color:var(--sub)}h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:30px 0 12px;letter-spacing:-1px}h2{margin:0 0 13px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--box);border:1px solid var(--line);border-radius:18px;padding:24px;margin:20px 0}.field{width:100%;background:#0e192a;color:white;border:1px solid #50607a;padding:13px;border-radius:10px;font:inherit}.field:focus{outline:2px solid var(--main)}label{display:block;font-size:13px;margin:12px 0 6px;color:var(--sub)}button{cursor:pointer;border:0;border-radius:10px;padding:13px 17px;background:var(--main);color:#08292b;font:inherit;font-weight:800}button.alt{background:#32435b;color:white}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.code{font-size:45px;letter-spacing:6px;font-weight:900;color:var(--main)}.players{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.player{background:#23334a;border-radius:12px;padding:15px;border:1px solid var(--line)}.player.me{border-color:var(--main)}.player strong{display:block;font-size:27px}.clue{background:#263850;border-radius:12px;padding:17px 20px;margin:12px 0;font-size:20px;font-weight:650}.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0}.choices button{background:#2a4059;color:white;border:1px solid #496079}.shape{background:#0e192a;border-radius:12px;display:grid;place-items:center;margin:18px 0}.shape svg{height:225px;width:100%;max-width:460px}.shape path{fill:var(--main)}.tag{font-size:12px;color:var(--main);letter-spacing:1.2px;font-weight:800}.notice{color:#ffa7ac;min-height:28px;margin-top:12px}footer{color:var(--sub);font-size:12px;margin-top:30px}@media(max-width:560px){.grid{grid-template-columns:1fr}.panel{padding:19px}.players{gap:8px}.choices{gap:8px}.choices button{padding:12px 7px}}

/* Country Quest design refresh */
:root{--bg:#080f1d;--box:#142338;--line:#334d64;--main:#8af4d5;--text:#f3f9ff;--sub:#a5bbcd}
html{scroll-behavior:smooth}
body{min-height:100vh;background:radial-gradient(ellipse 650px 510px at 85% 3%,#18364b 0,transparent 75%),radial-gradient(ellipse 640px 500px at 0 65%,#13253f 0,transparent 80%),#080f1d}
body:before{content:"";pointer-events:none;position:fixed;inset:0;background-image:radial-gradient(#93e3d814 1px,transparent 1px);background-size:26px 26px;opacity:.4;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
main{position:relative;max-width:1000px;padding:27px 24px 65px}
header{padding:3px 0 23px;border-color:#344b6088;gap:10px}
header b{font-size:23px;letter-spacing:-.8px;font-weight:900}
header .nav-tag{font-size:11px;letter-spacing:1.5px;color:#9bb2c5;font-weight:850;white-space:nowrap}
header .nav-tag i{display:inline-block;width:5px;height:5px;background:#74e8cd;border-radius:50%;margin:0 7px 2px}
h1{font-size:clamp(45px,7vw,79px);letter-spacing:-3.5px;line-height:1.04;margin:13px 0 19px;font-weight:900}
h1 em{font-style:normal;background:linear-gradient(95deg,#91f7d8,#83c3ff);color:transparent;background-clip:text}
h2{letter-spacing:-.55px}
.eyebrow{color:#8decd0;letter-spacing:2.5px;font-weight:900;font-size:11px;margin-top:46px;display:flex;align-items:center;gap:9px}
.pulse{width:8px;height:8px;border-radius:50%;background:#83eacf;box-shadow:0 0 0 5px #83eacf17}
.hero-copy{color:#acbfd0;margin:0 0 36px;font-size:18px}
.mode-grid{gap:20px;margin:25px 0 40px}
.mode-card{position:relative;overflow:hidden;isolation:isolate;min-height:270px;background:linear-gradient(145deg,#183245,#11263a);border:1px solid #38566e;border-radius:26px;padding:29px;box-shadow:0 18px 42px #0004;transition:transform .2s,border-color .2s,box-shadow .2s}
.mode-card:nth-child(2){background:linear-gradient(145deg,#2a2c49,#161f3e);border-color:#555471}
.mode-card:after{content:"";position:absolute;z-index:-1;width:260px;height:260px;border:1px solid #9ef9db25;border-radius:50%;right:-100px;bottom:-145px;box-shadow:0 0 0 38px #82e0d10b,0 0 0 80px #6bbddc09}
.mode-card:nth-child(2):after{border-color:#b0a7ff2a;box-shadow:0 0 0 38px #a49bef0a,0 0 0 80px #c6a3ff08}
.mode-card:hover,.mode-card:focus-visible{transform:translateY(-5px);border-color:#93ecd9;box-shadow:0 22px 52px #0008;outline:none}
.mode-icon{width:62px;height:62px;display:grid;place-items:center;border-radius:19px;background:#294b59;border:1px solid #467789;font-size:31px;box-shadow:0 8px 18px #0003}
.mode-card:nth-child(2) .mode-icon{background:#3c3a62;border-color:#635e91}
.mode-name{font-size:30px;letter-spacing:-.8px;font-weight:900;margin-top:20px}
.mode-desc{font-size:15px;line-height:1.55;max-width:260px;color:#b3c5d5}
.mode-action{display:inline-flex;background:#244a4c;color:#a4f6dc;padding:9px 14px;border-radius:100px;font-size:14px;align-items:center}
.mode-card:nth-child(2) .mode-action{background:#41405e;color:#d6d0ff}
.online-section{border-top:1px solid #324b60a0;padding-top:25px;margin-bottom:40px;scroll-margin-top:25px}
.online-section h2{font-size:27px}
.grid{gap:16px}
.panel{background:linear-gradient(150deg,#172a41,#101c2f);border-color:#36546c;border-radius:23px;padding:27px;box-shadow:0 12px 48px #0003}
.panel h2{font-size:24px}
.field{background:#0d1b2c;border-color:#476078}
.field:focus{outline:2px solid #90efd4}
button:not(.mode-card){background:linear-gradient(110deg,#9af9dc,#66d3de);transition:filter .15s,transform .15s}
button:not(.mode-card):hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
button.alt{background:#314860;color:#eff8ff}
.code{background:#0e2130;border:1px dashed #639c9a;padding:18px;border-radius:16px;display:inline-block;font-size:clamp(29px,6vw,49px)}
.players{gap:16px}
.player{background:#1d344c;border:1px solid #375574;border-radius:17px}
.player.me{background:#1d3b44;border-color:#79d9ba}
.player strong{color:#98f0d8;letter-spacing:-1px}
.clue{background:radial-gradient(circle at right top,#2b5257,transparent 68%),#24374f;border:1px solid #426479;border-radius:17px;padding:22px}
.tag{letter-spacing:1.8px;color:#91f7d8}
.choices{gap:13px}
.choices button{background:#263d57!important;color:#eff7ff;border:1px solid #43617a;border-radius:14px;min-height:60px}
.choices button:hover{background:#34506d!important}
.shape{position:relative;overflow:hidden;min-height:340px;border:1px solid #456d78;background:radial-gradient(ellipse at 50% 48%,#26495a,#101f34 75%);border-radius:21px}
.shape:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#8ee8d512 1px,transparent 1px),linear-gradient(90deg,#8ee8d512 1px,transparent 1px);background-size:32px 32px}
.shape:after{content:"";position:absolute;inset:15px;border:1px solid #a1dbda1b;border-radius:15px}
.shape svg{position:relative;z-index:1;max-width:580px;height:285px;filter:drop-shadow(0 12px 19px #0009)}
.shape path{stroke:#defff4;stroke-opacity:.4;stroke-width:.7;stroke-linejoin:round}
footer{margin-top:60px;border-top:1px solid #31445798;padding-top:25px}
@media(max-width:610px){main{padding:18px 15px 40px}header{padding-bottom:16px}header b{font-size:19px}header .nav-tag{font-size:9px}h1{letter-spacing:-2.4px;font-size:50px}.eyebrow{margin-top:29px}.mode-grid{grid-template-columns:1fr;gap:14px}.mode-card{min-height:208px;padding:23px}.mode-icon{width:52px;height:52px;font-size:26px}.mode-name{margin-top:15px;font-size:26px}.mode-card .mode-action{margin-top:12px}.shape{min-height:255px}.shape svg{height:225px}.panel{padding:21px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mode-card{transition:none}}
</style><link rel="stylesheet" href="/world-theme.css?v=2"><link rel="preconnect" href="https://images.unsplash.com" crossorigin><link rel="dns-prefetch" href="//images.unsplash.com"><link rel="stylesheet" href="/photo-theme.css?v=3"><link rel="stylesheet" href="/editorial.css?v=4"><link rel="stylesheet" href="/language.css?v=1"></head><body class="page-index"><div class="map-ambient" aria-hidden="true"></div><main><header class="editorial-header"><a href="/" class="brand-lockup" aria-label="Country Quest home"><span class="brand-mark" aria-hidden="true">✳</span><span class="brand-name">COUNTRY<span>QUEST</span><small>THE WORLD IS YOURS</small></span></a><nav aria-label="Main navigation"><a href="#modes">Explore</a><a href="/solo.html">Solo games</a><a href="/#online" id="navOnline" class="nav-play">Play online <span aria-hidden="true">↗</span></a><div class="language-toggle" role="group" aria-label="Language / Språk"><button type="button" data-language="sv" aria-pressed="false" aria-label="Svenska">🇸🇪 SV</button><button type="button" data-language="en" aria-pressed="true" aria-label="English">🇬🇧 EN</button></div></nav></header><div id="app"></div><footer><div class="world-footer-stamp">COUNTRY QUEST · WORLD EDITION</div><div>Play from different PCs using the same link. Private matches have 6 rounds. Room data is temporary. Geographic boundaries from Natural Earth.</div><div style="margin-top:9px;font-size:12px"><a class="photo-credit" href="/photo-credits.html">Real photo credits</a> · Photos via Unsplash</div></footer></main><script src="/translations-sv.js?v=1"></script><script src="/i18n.js?v=1"></script>
<script>
let session=null,state=null,busy=false,tick=null;const app=document.querySelector('#app');
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function api(action,extra={}){if(action==='answer'&&typeof extra.answer==='string')extra={...extra,answer:window.CQI18N?.canonicalCountry(extra.answer)||extra.answer};let response=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,...extra})});let result=await response.json();if(!response.ok)throw Error(result.error||'Network error');return result}
function save(){try{localStorage.setItem('country-quest-session',JSON.stringify(session))}catch{}}
function leave(){session=null;state=null;try{localStorage.removeItem('country-quest-session')}catch{}landing()}
function landing(){
  const invited=new URLSearchParams(location.search).get('room');
  app.innerHTML=`
    <section class="world-hero hero editorial-hero" aria-label="Explore Country Quest">
      <div class="hero-content">
        <div class="world-eyebrow">THE ULTIMATE GEOGRAPHY CHALLENGE</div>
        <div class="hero-accent-line"></div>
        <h1>There's a whole<br><em>world to discover.</em></h1>
        <p class="hero-copy">From faraway landmarks to familiar borders. Test what you know, discover what you don't.</p>
        <div class="hero-ctas">
          <a href="#modes" class="hero-primary">Start exploring <span aria-hidden="true">↗</span></a>
          <button type="button" class="hero-secondary" id="heroOnline">Play with a friend <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="hero-photo-credit">THE WORLD AWAITS &nbsp; ✳ &nbsp; COUNTRY QUEST</div>
    </section>

    <div class="journey-strip" aria-label="How to play">
      <span><b>01</b> Pick a challenge</span><i aria-hidden="true"></i>
      <span><b>02</b> Explore the clues</span><i aria-hidden="true"></i>
      <span><b>03</b> Earn your score</span>
    </div>

    <section class="explore-section" id="modes">
      <div class="section-head">
        <div>
          <span class="section-eyebrow">YOUR NEXT ADVENTURE</span>
          <h2>Where to next<span class="period">?</span></h2>
        </div>
        <p>Four ways to travel the world.<br>Every round is a new discovery.</p>
      </div>
      <div class="mode-grid photo-mode-grid">
        <a class="mode-card mode-clues" href="/solo.html?mode=clues">
          <div class="photo-card-top"><span class="card-index">01 / SOLO</span><span class="card-corner" aria-hidden="true">↗</span></div>
          <div class="photo-card-bottom"><span class="mode-icon" aria-hidden="true">✦</span><div class="mode-name">Country Clues</div>
          <p class="mode-desc">Five hints. One destination. Guess early to score big.</p><span class="mode-action">Explore clues <span aria-hidden="true">↗</span></span></div>
        </a>
        <a class="mode-card mode-outline" href="/solo.html?mode=outline">
          <div class="photo-card-top"><span class="card-index">02 / SOLO</span><span class="card-corner" aria-hidden="true">↗</span></div>
          <div class="photo-card-bottom"><span class="mode-icon" aria-hidden="true">◇</span><div class="mode-name">Country Outlines</div>
          <p class="mode-desc">No names. Just real borders. Do you know the shape?</p><span class="mode-action">Explore maps <span aria-hidden="true">↗</span></span></div>
        </a>
        <a class="mode-card mode-year" href="/solo.html?mode=year">
          <div class="photo-card-top"><span class="card-index">03 / SOLO</span><span class="card-corner" aria-hidden="true">↗</span></div>
          <div class="photo-card-bottom"><span class="mode-icon" aria-hidden="true">◷</span><div class="mode-name">Guess the Year</div>
          <p class="mode-desc">How well do you remember moments that shaped history?</p><span class="mode-action">Travel through time <span aria-hidden="true">↗</span></span></div>
        </a>
        <button class="mode-card mode-online" type="button" id="onlineMode">
          <div class="photo-card-top"><span class="card-index">04 / MULTIPLAYER</span><span class="live-indicator"><span></span> LIVE MATCH</span></div>
          <div class="photo-card-bottom"><span class="mode-icon" aria-hidden="true">◎</span><div class="mode-name">Online Multiplayer</div>
          <p class="mode-desc">Challenge a friend anywhere in the world. One winner.</p><span class="mode-action">Create a room <span aria-hidden="true">↗</span></span></div>
        </button>
      </div>
    </section>

    <section class="editorial-note" aria-label="About the game"><span class="editorial-note-star" aria-hidden="true">✳</span>
      <div><strong>Your passport to everywhere.</strong><p>Pick up and play. Real country outlines, clever clues and a little healthy competition.</p></div>
      <a href="/solo.html">All solo games <span aria-hidden="true">→</span></a>
    </section>
    <section class="online-section" id="onlineForms" ${invited||location.hash==='#online'?'':'hidden'}>
      <h2>Online multiplayer</h2>
      <div class="grid">
        <div class="panel"><h2>Create room</h2>
          <form id="create"><label>Your name</label><input class="field" name="name" maxlength="24" required placeholder="Your name">
          <div class="actions"><button>Create room</button></div></form>
        </div>
        <div class="panel"><h2>Join room</h2>
          <form id="join"><label>Your name</label><input class="field" name="name" maxlength="24" required placeholder="Your name">
          <label>Room code</label><input class="field" name="code" maxlength="6" required placeholder="ABC123" style="text-transform:uppercase">
          <div class="actions"><button>Join match</button></div></form>
        </div>
      </div>
      <p class="notice" id="message"></p>
    </section>
  `;
  const revealOnline=()=>{
    const section=document.getElementById('onlineForms');
    if(!section)return;
    section.hidden=false;
    if(location.hash!=='#online')history.replaceState(null,'','#online');
    section.scrollIntoView({behavior:'smooth',block:'start'});
  };
  document.getElementById('onlineMode').onclick=revealOnline;
  document.getElementById('heroOnline').onclick=revealOnline;
  const headerOnline=document.getElementById('navOnline');
  if(headerOnline)headerOnline.onclick=(e)=>{e.preventDefault();revealOnline()};
  ['create','join'].forEach(action=>{
    document.getElementById(action).onsubmit=async e=>{
      e.preventDefault();
      const button=e.currentTarget.querySelector('button');
      button.disabled=true;
      const form=Object.fromEntries(new FormData(e.currentTarget));
      try{
        const response=await api(action,form);
        session={code:response.code,token:response.token};
        save();state=response;render();
      }catch(err){document.querySelector('#message').textContent=err.message;button.disabled=false;}
    };
  });
  if(invited){
    document.querySelector('#join [name=code]').value=invited.toUpperCase();
  }
}
const scores=()=>'<div class="players">'+state.players.map((p,i)=>'<div class="player '+(i===state.you?'me':'')+'"><div class="muted">'+escapeHTML(p.name)+(i===state.you?' (you)':'')+'</div><strong>'+p.score+' pts</strong><small>'+(p.done?'✓ Answered':'Thinking…')+'</small></div>').join('')+'</div>';
function render(){if(!session){landing();return}if(!state)return;let h='';if(!state.started){h='<h1>Invite a friend.</h1><div class="panel"><p class="muted">Share this room code:</p><div class="code">'+state.code+'</div><div class="actions"><button id="copy">Copy invitation link</button><button class="alt" id="leave">Leave</button></div><p class="muted">Waiting for player 2...</p></div>'}
else if(state.finished){let [a,b]=state.players;h='<h1>🏆 '+(a.score===b.score?"It's a tie!":escapeHTML(a.score>b.score?a.name:b.name)+' wins!')+'</h1><div class="panel"><h2>Final scores</h2>'+scores()+'<div class="actions"><button id="leave">Play again</button></div></div>'}
else{let q=state.question;h='<div style="margin-top:23px" class="tag">ROUND '+(state.round+1)+' / '+state.total+' · '+(q.type==='clues'?'COUNTRY CLUES':q.type==='outline'?'COUNTRY OUTLINE':'GUESS THE YEAR')+'</div>'+scores()+'<div class="panel">';if(state.yourDone){h+='<h2>Answer submitted ✓</h2><p class="muted">Your answer: '+escapeHTML(state.yourAnswer)+'</p>'+(state.correctAnswer!==null?'<p>Correct answer: <b>'+escapeHTML(state.correctAnswer)+'</b></p><div class="actions"><button id="ready" '+(state.players[state.you].ready?'disabled':'')+'>'+(state.players[state.you].ready?'Waiting for friend…':'Next round →')+'</button></div>':'<p class="muted">Waiting for your friend to finish...</p>')}
else if(q.type==='clues'){h+='<div class="tag">CLUE '+(q.clue+1)+' / 5 · '+[100,80,60,40,20][q.clue]+' POINTS</div>'+q.clues.map(x=>'<div class="clue">'+escapeHTML(x)+'</div>').join('')+'<form id="answer"><input class="field" id="guess" required autocomplete="off" placeholder="Enter country name"><div class="actions"><button>Guess</button><button class="alt" type="button" id="clue" '+(q.clue===4?'disabled':'')+'>Next clue →</button></div></form>'}
else{h+=q.type==='outline'?'<h2>What country is this?</h2><div class="shape"><svg role="img" aria-label="Accurate country silhouette" viewBox="'+escapeHTML(q.viewBox||'0 0 320 220')+'" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="geoFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2f7da"/><stop offset="1" stop-color="#47bedb"/></linearGradient></defs><path d="'+escapeHTML(q.shape)+'" fill="url(#geoFill)" fill-rule="evenodd"/></svg></div>':'<h2>Guess the year</h2><div class="clue">'+escapeHTML(q.prompt)+'</div>';h+='<div class="choices">'+q.options.map(x=>'<button data-choice="'+escapeHTML(x)+'">'+escapeHTML(x)+'</button>').join('')+'</div>'}h+='<div class="notice" id="message"></div></div><button class="alt" id="leave">Leave match</button>'}
app.innerHTML=h;let el=id=>document.getElementById(id);if(el('copy'))el('copy').onclick=async()=>{let link=location.origin+'/?room='+encodeURIComponent(state.code);try{await navigator.clipboard.writeText(link);el('copy').textContent='Link copied!'}catch{prompt('Copy link:',link)}};if(el('leave'))el('leave').onclick=()=>{if(confirm('Leave this match?'))leave()};if(el('answer'))el('answer').onsubmit=e=>{e.preventDefault();act('answer',{answer:el('guess').value})};if(el('clue'))el('clue').onclick=()=>act('clue');if(el('ready'))el('ready').onclick=()=>act('ready');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>act('answer',{answer:b.dataset.choice}))}
async function act(action,extra={}){if(busy)return;busy=true;try{state=await api(action,extra);render()}catch(err){let m=document.getElementById('message');if(m)m.textContent=err.message;else alert(err.message)}finally{busy=false}}
async function poll(){if(!session||busy)return;try{const fresh=await api('state');if(JSON.stringify(fresh)!==JSON.stringify(state)){state=fresh;render()}}catch(err){if(/Room not found|Invalid player session/.test(err.message)){leave()}else{let m=document.getElementById('message');if(m)m.textContent='Connection lost. Retrying...'}}}
try{session=JSON.parse(localStorage.getItem('country-quest-session')||'null')}catch{}if(session)poll();else landing();setInterval(poll,1300);
</script></body></html>
