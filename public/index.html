    section.hidden=false;
    if(location.hash!=='#online')history.replaceState(null,'','#online');
    section.scrollIntoView({behavior:'smooth',block:'start'});
  };
  if(document.getElementById('resumeClassic'))document.getElementById('resumeClassic').onclick=resumePrevious;
  if(document.getElementById('forgetClassic'))document.getElementById('forgetClassic').onclick=()=>{savedSession=null;try{localStorage.removeItem('country-quest-session')}catch{}landing()};
  document.getElementById('onlineMode').onclick=revealOnline;
  document.getElementById('heroOnline').onclick=revealOnline;
  const headerOnline=document.getElementById('navOnline');
  if(headerOnline)headerOnline.onclick=(e)=>{e.preventDefault();revealOnline()};
  document.getElementById('allSubjects').onclick=()=>document.querySelectorAll('#create [name=subject]').forEach(x=>x.checked=true);
  document.getElementById('clearSubjects').onclick=()=>document.querySelectorAll('#create [name=subject]').forEach(x=>x.checked=false);
  ['create','join'].forEach(action=>{
    document.getElementById(action).onsubmit=async e=>{
      e.preventDefault();
      const button=e.currentTarget.querySelector('button[type=submit],button:not([type])');
      const rawForm=new FormData(e.currentTarget);
      const form=Object.fromEntries(rawForm);
      if(action==='create'){
        form.subjects=rawForm.getAll('subject');
        if(!form.subjects.length){document.querySelector('#message').textContent=multilang('Choose at least one subject.','Välj minst ett ämne.');return}
        form.mode='quiz';
      }
      button.disabled=true;
      const originalLabel=button.textContent;
      button.textContent=multilang(action==='create'?'Creating room…':'Joining room…',action==='create'?'Skapar rum…':'Går med i rum…');
      const notice=document.querySelector('#message');
      if(notice)notice.textContent=multilang('Connecting to the game server…','Ansluter till spelservern…');
      try{
        const response=await api(action,form);
        session={code:response.code,token:response.token};
        save();state=response;render();
      }catch(err){document.querySelector('#message').textContent=err?.message||'Could not connect to the game server.';button.disabled=false;button.textContent=originalLabel;}
    };
  });
  if(invited){
    document.querySelector('#join [name=code]').value=invited.toUpperCase();
  }
}
async function resumePrevious(){
 if(busy||!savedSession)return;
 busy=true;
 const button=document.getElementById('resumeClassic');
 if(button){button.disabled=true;button.textContent=multilang('Opening room…','Öppnar rum…')}
 try{
  session={code:savedSession.code,token:savedSession.token};
  const next=await api('state');
  if(!next||next.code!==session.code)throw Error('Room expired');
  state=next;render();
 }catch(e){
  session=null;state=null;savedSession=null;
  try{localStorage.removeItem('country-quest-session')}catch{}
  landing();
  const msg=document.getElementById('message');
  if(msg)msg.textContent=multilang('Previous room unavailable. Create a new one or join a friend.','Tidigare rum finns inte. Skapa ett nytt eller gå med hos en vän.');
 }finally{busy=false}
}
const scores=()=>'<div class="players">'+state.players.map((p,i)=>'<div class="player '+(i===state.you?'me':'')+'"><div class="muted">'+escapeHTML(p.name)+(i===state.you?' (you)':'')+'</div><strong>'+p.score+' pts</strong><small>'+(p.done?'✓ Answered':'Thinking…')+'</small></div>').join('')+'</div>';
let lastRenderedRound=null;
function syncPlayerCards(){
  const cards=app.querySelectorAll('.players .player');
  if(cards.length!==state.players.length)return false;
  state.players.forEach((p,i)=>{
    const card=cards[i];
    const name=card.querySelector('.muted'),score=card.querySelector('strong'),status=card.querySelector('small');
    if(name)name.textContent=p.name+(i===state.you?' (you)':'');
    if(score)score.textContent=p.score+' pts';
    if(status)status.textContent=p.done?'✓ Answered':'Thinking…';
  });
  return true;
}
function render(){if(!session){lastRenderedRound=null;landing();return}if(!state)return;
  // Never throw away the player's typed answer when a rival scores or new clues arrive.
  const oldInput=app.querySelector('#guess');
  const sameRound=lastRenderedRound===state.code+':'+state.round;
  const draft=sameRound&&oldInput&&!state.yourDone?{
    value:oldInput.value,
    focused:document.activeElement===oldInput,
    start:oldInput.selectionStart,
    end:oldInput.selectionEnd
  }:null;
const difficultyName=({easy:multilang('Easy','Lätt'),medium:multilang('Medium','Medel'),hard:multilang('Hard','Svår')})[state.difficulty]||'Medium';
const subjectNames=(state.subjects||[]).map(c=>SUBJECT_LABELS[c]?.[multiplayerLanguage()]||c);
const subjectDisplay='<div class="difficulty-readout">'+multilang('Difficulty: ','Svårighetsgrad: ')+'<strong>'+escapeHTML(difficultyName)+'</strong> · '
 +multilang('Subjects: ','Ämnen: ')+'<strong>'+escapeHTML(subjectNames.length>5?subjectNames.length+' '+multilang('selected','valda'):subjectNames.join(', '))+'</strong></div>';
const answerLabel=q=>{
 if(q.type==='trivia'){
  return localizedOption(q.options.find(opt=>opt.id===state.yourAnswer))||'';
 }
 return state.yourAnswer;
};
const correctLabel=q=>q.type==='trivia'?localizedOption(state.correctAnswer):state.correctAnswer;
let h='';
if(!state.started){
 h='<h1>'+multilang('Invite a friend.','Bjud in en vän.')+'</h1><div class="panel">'
  +'<p class="muted">'+multilang('Share this room code:','Dela rumskoden:')+'</p><div class="code">'+escapeHTML(state.code)+'</div>'+subjectDisplay
  +'<div class="actions"><button id="copy">'+multilang('Copy invitation link','Kopiera inbjudningslänk')+'</button><button class="alt" id="leave">'+multilang('Leave','Lämna')+'</button></div>'
  +'<p class="muted">'+multilang('Waiting for player 2...','Väntar på spelare två...')+'</p></div>';
}else if(state.finished){
 const [a,b]=state.players;
 h='<h1>🏆 '+(a.score===b.score?multilang("It's a tie!",'Oavgjort!'):escapeHTML(a.score>b.score?a.name:b.name)+' '+multilang('wins!','vinner!'))+'</h1>'
  +'<div class="panel"><h2>'+multilang('Final scores','Slutresultat')+'</h2>'+subjectDisplay+scores()
  +'<div class="actions"><button id="leave">'+multilang('Play again','Spela igen')+'</button></div></div>';
}else{
 const q=state.question;
 const title=q.type==='clues'?multilang('COUNTRY CLUES','LANDSLEDTRÅDAR'):
  q.type==='outline'?multilang('COUNTRY OUTLINE','LANDSKONTUR'):
  q.type==='year'?multilang('GUESS THE YEAR','GISSA ÅRET'):
  multilang('GENERAL KNOWLEDGE','ALLMÄNBILDNING');
 h='<div style="margin-top:23px" class="tag">'+multilang('ROUND','RUNDA')+' '+(state.round+1)+' / '+state.total+' · '+title+'</div>'+subjectDisplay+scores()+'<div class="panel">';
 if(state.yourDone){
  h+='<h2>'+multilang('Answer submitted ✓','Svar skickat ✓')+'</h2>'
   +'<p class="muted">'+multilang('Your answer: ','Ditt svar: ')+escapeHTML(answerLabel(q))+'</p>';
  if(state.correctAnswer!==null){
   h+='<div class="answer-feedback '+(state.yourCorrect?'correct':'incorrect')+'">'
     +(state.yourCorrect?multilang('✓ Correct','✓ Rätt'):multilang('✗ Incorrect','✗ Fel'))+'</div>'
     +'<p>'+multilang('Correct answer: ','Rätt svar: ')+'<b>'+escapeHTML(correctLabel(q))+'</b></p>'
     +'<div class="actions"><button id="ready" '+(state.players[state.you].ready?'disabled':'')+'>'
     +(state.players[state.you].ready?multilang('Waiting for friend…','Väntar på vännen…'):multilang('Next round →','Nästa runda →'))+'</button></div>';
  }else{
   h+='<p class="muted">'+multilang('Waiting for your friend to finish...','Väntar på din vän...')+'</p>';
  }
 }else if(q.type==='clues'){
  h+='<div class="tag">'+multilang('CLUE','LEDTRÅD')+' '+(q.clue+1)+' / 5 · '+[100,80,60,40,20][q.clue]+' '+multilang('POINTS','POÄNG')+'</div>'
   +q.clues.map(x=>'<div class="clue">'+escapeHTML(x)+'</div>').join('')
   +'<form id="answer"><input class="field" id="guess" required autocomplete="off" placeholder="'+multilang('Enter country name','Skriv landets namn')+'"><div class="actions"><button>'+multilang('Guess','Gissa')+'</button><button class="alt" type="button" id="clue" '+(q.clue===4?'disabled':'')+'>'+multilang('Next clue →','Nästa ledtråd →')+'</button></div></form>';
 }else if(q.type==='trivia'){
  const tag=SUBJECT_LABELS[q.category]?.[multiplayerLanguage()]||q.category;
  h+='<span class="question-subject">'+escapeHTML(tag)+'</span>'
   +'<h2 class="trivia-prompt">'+escapeHTML(multiplayerLanguage()==='sv'?q.promptSv:q.prompt)+'</h2>'
   +'<div class="trivia-options">'+q.options.map(opt=>'<button type="button" data-choice="'+escapeHTML(opt.id)+'">'+escapeHTML(localizedOption(opt))+'</button>').join('')+'</div>';
 }else{
  if(q.type==='outline'){
   h+='<h2>'+multilang('What country is this?','Vilket land är det?')+'</h2><div class="shape"><svg role="img" aria-label="Country silhouette" viewBox="'+escapeHTML(q.viewBox||'0 0 320 220')+'" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="geoFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2f7da"/><stop offset="1" stop-color="#47bedb"/></linearGradient></defs><path d="'+escapeHTML(q.shape)+'" fill="url(#geoFill)" fill-rule="evenodd"/></svg></div>';
  }else{
   h+='<h2>'+multilang('Guess the year','Gissa året')+'</h2><div class="clue">'+escapeHTML(q.promptSv&&multiplayerLanguage()==='sv'?q.promptSv:q.prompt)+'</div>';
  }
  h+='<div class="choices">'+q.options.map(x=>'<button data-choice="'+escapeHTML(x)+'">'+escapeHTML(x)+'</button>').join('')+'</div>';
 }
 h+='<div class="notice" id="message"></div></div><button class="alt" id="leave">'+multilang('Leave match','Lämna match')+'</button>';
}
app.innerHTML=h;
lastRenderedRound=state.code+':'+state.round;
if(draft){
  const input=app.querySelector('#guess');
  if(input){
    input.value=draft.value;
    if(draft.focused){
      input.focus({preventScroll:true});
      try{input.setSelectionRange(draft.start,draft.end)}catch(e){}
    }
  }
}
let el=id=>document.getElementById(id);if(el('copy'))el('copy').onclick=async()=>{let link=location.origin+'/?room='+encodeURIComponent(state.code);try{await navigator.clipboard.writeText(link);el('copy').textContent='Link copied!'}catch{prompt('Copy link:',link)}};if(el('leave'))el('leave').onclick=()=>{if(confirm('Leave this match?'))leave()};if(el('answer'))el('answer').onsubmit=e=>{e.preventDefault();act('answer',{answer:el('guess').value})};if(el('clue'))el('clue').onclick=()=>act('clue');if(el('ready'))el('ready').onclick=()=>act('ready');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>act('answer',{answer:b.dataset.choice}))}
async function act(action,extra={}){if(busy)return;busy=true;try{state=await api(action,extra);render()}catch(err){let m=document.getElementById('message');if(m)m.textContent=err.message;else alert(err.message)}finally{busy=false}}
async function poll(){if(!session||busy)return;try{const fresh=await api('state');if(JSON.stringify(fresh)!==JSON.stringify(state)){
      const previous=state;
      const onlyOtherPlayerUpdated=previous&&fresh.started&&!fresh.finished&&
        !fresh.yourDone&&!previous.yourDone&&
        fresh.code===previous.code&&fresh.round===previous.round&&
        JSON.stringify(fresh.question)===JSON.stringify(previous.question)&&
        JSON.stringify(fresh.players?.[fresh.you])===JSON.stringify(previous.players?.[previous.you])&&
        fresh.correctAnswer===previous.correctAnswer;
      state=fresh;
      if(!onlyOtherPlayerUpdated||!syncPlayerCards())render();
    }}catch(err){if(/Room not found|Invalid player session/.test(err.message)){leave()}else{let m=document.getElementById('message');if(m)m.textContent='Connection lost. Retrying...'}}}
try{
 const previous=JSON.parse(localStorage.getItem('country-quest-session')||'null');
 if(previous&&typeof previous.code==='string'&&/^[A-Z0-9]{6}$/.test(previous.code)
    &&typeof previous.token==='string'&&/^[a-f0-9]{48}$/.test(previous.token)){
  savedSession={code:previous.code,token:previous.token};
 }
}catch{}
/* Always show the games and room creator first. Resume is an explicit choice. */
landing();
setInterval(poll,1300);
</script></body></html>
